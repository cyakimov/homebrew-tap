name: Casks

on:
  push:
    branches: [main]
    paths: ['Casks/**', '.github/workflows/casks.yml']
  pull_request:
    paths: ['Casks/**', '.github/workflows/casks.yml']

permissions:
  contents: read

jobs:
  casks:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}
      - name: Check cask style and release download
        env:
          TAP_PATH: ${{ steps.brew.outputs.repository-path }}
        run: |
          if [[ ! -f "$TAP_PATH/Casks/metron-app.rb" ]]; then
            echo "The first app release will add the Metron cask."
            exit 0
          fi
          brew style "$TAP_PATH/Casks/metron-app.rb"
          brew audit --cask --strict --online cyakimov/tap/metron-app
